<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Every action is an activity"><title>Every action is an activity</title><desc>Landscape queues the work; the client collects it on its next check-in. That&#x27;s why it works behind firewalls.</desc><defs><marker id="a-E95420" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E95420"/></marker><marker id="s-E95420" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E95420"/></marker><marker id="a-772953" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#772953"/></marker><marker id="s-772953" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#772953"/></marker><marker id="a-1A1A1A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="s-1A1A1A" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="a-333333" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="s-333333" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="a-6B6B6B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B6B"/></marker><marker id="s-6B6B6B" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B6B"/></marker><marker id="a-0E8420" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E8420"/></marker><marker id="s-0E8420" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E8420"/></marker><marker id="a-C7162B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7162B"/></marker><marker id="s-C7162B" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7162B"/></marker><marker id="a-C27A00" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A00"/></marker><marker id="s-C27A00" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A00"/></marker><marker id="a-9A9A9A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A9A9A"/></marker><marker id="s-9A9A9A" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A9A9A"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="44" width="64" height="8" rx="2" fill="#E95420"/><text x="80" y="104" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="46" font-weight="700" fill="#1A1A1A">Every action is an activity</text><text x="80" y="146" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="25" fill="#6B6B6B">Landscape queues the work; the client collects it on its next check-in. That&#x27;s why it works behind firewalls.</text><rect x="80" y="190" width="1440" height="255" rx="16" fill="#FDEEE8" stroke="none" stroke-width="2"/><rect x="80" y="465" width="1440" height="255" rx="16" fill="#F7F7F7" stroke="none" stroke-width="2"/><text x="104" y="222" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#E95420" text-anchor="start">LANDSCAPE SERVER</text><text x="104" y="497" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#6B6B6B" text-anchor="start">MANAGED MACHINE (Landscape Client)</text><rect x="130" y="255" width="300" height="160" rx="14" fill="#fff" stroke="#CDCDCD" stroke-width="2"/><text x="152" y="301" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">Admin asks</text><text x="152" y="338" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">Click in the portal,</text><text x="152" y="363" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">or call the REST API</text><circle cx="130" cy="255" r="22" fill="#E95420"/><text x="130" y="262.92" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="530" y="255" width="300" height="160" rx="14" fill="#fff" stroke="#CDCDCD" stroke-width="2"/><text x="552" y="301" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">Activity queued</text><text x="552" y="338" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">Queued, or Scheduled</text><text x="552" y="363" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">for a maintenance window</text><circle cx="530" cy="255" r="22" fill="#E95420"/><text x="530" y="262.92" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="1170" y="255" width="320" height="160" rx="14" fill="#FDEEE8" stroke="#E95420" stroke-width="2"/><text x="1192" y="301" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">Result recorded</text><text x="1192" y="338" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">Succeeded or Failed, with</text><text x="1192" y="363" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">who · when · output</text><circle cx="1170" cy="255" r="22" fill="#E95420"/><text x="1170" y="262.92" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">6</text><rect x="530" y="530" width="300" height="160" rx="14" fill="#fff" stroke="#CDCDCD" stroke-width="2"/><text x="552" y="576" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">Client checks in</text><text x="552" y="613" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">Outbound HTTPS; collects</text><text x="552" y="638" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">the queued activity</text><circle cx="530" cy="530" r="22" fill="#E95420"/><text x="530" y="537.92" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="850" y="530" width="300" height="160" rx="14" fill="#fff" stroke="#CDCDCD" stroke-width="2"/><text x="872" y="576" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">Runs it locally</text><text x="872" y="613" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">e.g. apt upgrade, a script,</text><text x="872" y="638" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">as an allowed user</text><circle cx="850" cy="530" r="22" fill="#E95420"/><text x="850" y="537.92" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">4</text><line x1="430" y1="335" x2="522" y2="335" stroke="#333333" stroke-width="3" marker-end="url(#a-333333)"/><line x1="680" y1="415" x2="680" y2="522" stroke="#333333" stroke-width="3" marker-end="url(#a-333333)"/><rect x="611.5" y="453.85" width="137" height="25.5" rx="6" fill="#fff" stroke="none" stroke-width="0"/><text x="680" y="471.7" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#6B6B6B" text-anchor="middle">next check-in</text><line x1="830" y1="610" x2="842" y2="610" stroke="#333333" stroke-width="3" marker-end="url(#a-333333)"/><path d="M1150,610 L1330,610 L1330,423" fill="none" stroke="#333333" stroke-width="3" marker-end="url(#a-333333)"/><circle cx="1250" cy="610" r="18" fill="#333333"/><text x="1250" y="616.48" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="1252.0" y="453.85" width="156" height="25.5" rx="6" fill="#fff" stroke="none" stroke-width="0"/><text x="1330" y="471.7" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#6B6B6B" text-anchor="middle">result reported</text><text x="80" y="772" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="start">Activity states:</text><rect x="245.0" y="750.0" width="97" height="32" rx="16.0" fill="#fff" stroke="#CDCDCD" stroke-width="1.5"/><text x="293.5" y="772.12" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#333333" text-anchor="middle">Queued</text><rect x="354.0" y="750.0" width="128" height="32" rx="16.0" fill="#fff" stroke="#CDCDCD" stroke-width="1.5"/><text x="418.0" y="772.12" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#333333" text-anchor="middle">Scheduled</text><rect x="494.0" y="750.0" width="107" height="32" rx="16.0" fill="#fff" stroke="#CDCDCD" stroke-width="1.5"/><text x="547.5" y="772.12" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#333333" text-anchor="middle">Waiting</text><rect x="613.0" y="750.0" width="107" height="32" rx="16.0" fill="#fff" stroke="#CDCDCD" stroke-width="1.5"/><text x="666.5" y="772.12" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#333333" text-anchor="middle">Blocked</text><rect x="732.0" y="750.0" width="149" height="32" rx="16.0" fill="#fff" stroke="#CDCDCD" stroke-width="1.5"/><text x="806.5" y="772.12" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#333333" text-anchor="middle">In progress</text><rect x="893.0" y="750.0" width="128" height="32" rx="16.0" fill="#fff" stroke="#CDCDCD" stroke-width="1.5"/><text x="957.0" y="772.12" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#0E8420" text-anchor="middle">Succeeded</text><rect x="1033.0" y="750.0" width="97" height="32" rx="16.0" fill="#fff" stroke="#CDCDCD" stroke-width="1.5"/><text x="1081.5" y="772.12" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#C7162B" text-anchor="middle">Failed</text><rect x="1142.0" y="750.0" width="118" height="32" rx="16.0" fill="#fff" stroke="#CDCDCD" stroke-width="1.5"/><text x="1201.0" y="772.12" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#333333" text-anchor="middle">Canceled</text><text x="80" y="815" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">Every activity is visible under Activities, and per machine on its Activities tab: a complete audit trail.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="1.5"/><text x="80" y="874" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#8A8A8A">Landscape Onboarding Labs · Labs 02 and 07</text><text x="1520" y="874" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#8A8A8A" text-anchor="end">Source: Landscape documentation (Canonical)</text></svg>
