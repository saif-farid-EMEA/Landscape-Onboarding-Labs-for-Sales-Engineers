, which machine you&#x27;re on, and where you are</text><rect x="180" y="200" width="1240" height="250" rx="16" fill="#2C001E" stroke="#2C001E" stroke-width="2"/><circle cx="214" cy="232" r="9" fill="#E95420"/><circle cx="244" cy="232" r="9" fill="#888888"/><circle cx="274" cy="232" r="9" fill="#888888"/><text x="800" y="239" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#BBBBBB" text-anchor="middle">Terminal</text><text x="330.0" y="365" font-family="'Ubuntu Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="72" font-weight="700" fill="#8AE234" text-anchor="start" textLength="259.2" lengthAdjust="spacingAndGlyphs">ubuntu</text><text x="589.2" y="365" font-family="'Ubuntu Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="72" font-weight="700" fill="#8AE234" text-anchor="start" textLength="43.2" lengthAdjust="spacingAndGlyphs">@</text><text x="632.4000000000001" y="365" font-family="'Ubuntu Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="72" font-weight="700" fill="#8AE234" text-anchor="start" textLength="302.4" lengthAdjust="spacingAndGlyphs">sandbox</text><text x="934.8000000000001" y="365" font-family="'Ubuntu Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="start" textLength="43.2" lengthAdjust="spacingAndGlyphs">:</text><text x="978.0" y="365" font-family="'Ubuntu Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="72" font-weight="700" fill="#729FCF" text-anchor="start" textLength="43.2" lengthAdjust="spacingAndGlyphs">~</text><text x="1021.2" y="365" font-family="'Ubuntu Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="start" textLength="43.2" lengthAdjust="spacingAndGlyphs">$</text><rect x="1078.4" y="307" width="34" height="66" fill="#FFFFFF" opacity="0.85"/><line x1="260" y1="580" x2="459.6" y2="392" stroke="#E95420" stroke-width="2.5" marker-end="url(#a-E95420)"/><rect x="110" y="580" width="300" height="170" rx="14" fill="#FDEEE8" stroke="#E95420" stroke-width="2"/><text x="132" y="625" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="23" font-weight="700" fill="#1A1A1A" text-anchor="start">Your username</text><text x="132" y="662" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">Who you&#x27;re logged in as</text><line x1="620" y1="580" x2="783.6" y2="392" stroke="#E95420" stroke-width="2.5" marker-end="url(#a-E95420)"/><rect x="470" y="580" width="300" height="170" rx="14" fill="#FDEEE8" stroke="#E95420" stroke-width="2"/><text x="492" y="625" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="23" font-weight="700" fill="#1A1A1A" text-anchor="start">The machine&#x27;s name</text><text x="492" y="662" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">Always check it: is this</text><text x="492" y="687" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">the machine you meant?</text><line x1="980" y1="580" x2="999.6" y2="392" stroke="#E95420" stroke-width="2.5" marker-end="url(#a-E95420)"/><rect x="830" y="580" width="300" height="170" rx="14" fill="#FDEEE8" stroke="#E95420" stroke-width="2"/><text x="852" y="625" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="23" font-weight="700" fill="#1A1A1A" text-anchor="start">Where you are</text><text x="852" y="662" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">~ is your home folder;</text><text x="852" y="687" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">otherwise a path like /etc</text><line x1="1340" y1="580" x2="1042.8000000000002" y2="392" stroke="#E95420" stroke-width="2.5" marker-end="url(#a-E95420)"/><rect x="1190" y="580" width="300" height="170" rx="14" fill="#FDEEE8" stroke="#E95420" stroke-width="2"/><text x="1212" y="625" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="23" font-weight="700" fill="#1A1A1A" text-anchor="start">Your power level</text><text x="1212" y="662" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">$ = normal user</text><text x="1212" y="687" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start"># = root (be careful!)</text><text x="800" y="815" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="20" font-weight="600" fill="#333333" text-anchor="middle">Demo habit: check the hostname in the prompt before every command.</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="1.5"/><text x="80" y="874" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#8A8A8A">Landscape Onboarding Labs · Lab 01</text><text x="1520" y="874" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#8A8A8A" text-anchor="end">Source: Landscape documentation (Canonical)</text></svg>
