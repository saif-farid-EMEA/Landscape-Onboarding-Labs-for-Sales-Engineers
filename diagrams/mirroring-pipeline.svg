Liberation Sans', sans-serif" font-size="23" font-weight="700" fill="#1A1A1A" text-anchor="start">Repo profile</text><text x="1084" y="410" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#333333" text-anchor="start">APT source and</text><text x="1084" y="434" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#333333" text-anchor="start">your public key,</text><text x="1084" y="458" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#333333" text-anchor="start">sent to tagged</text><text x="1084" y="482" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#333333" text-anchor="start">machines</text><rect x="1310" y="300" width="200" height="230" rx="14" fill="#E7F4EA" stroke="#0E8420" stroke-width="2"/><text x="1330" y="336" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#E95420" text-anchor="start">5 · INSTALL</text><text x="1330" y="372" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="23" font-weight="700" fill="#1A1A1A" text-anchor="start">Machines</text><text x="1330" y="410" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#333333" text-anchor="start">Install only</text><text x="1330" y="434" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#333333" text-anchor="start">what you</text><text x="1330" y="458" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#333333" text-anchor="start">approved</text><line x1="284" y1="415" x2="320" y2="415" stroke="#333333" stroke-width="3" marker-end="url(#a-333333)"/><line x1="530" y1="415" x2="566" y2="415" stroke="#333333" stroke-width="3" marker-end="url(#a-333333)"/><line x1="776" y1="415" x2="812" y2="415" stroke="#333333" stroke-width="3" marker-end="url(#a-333333)"/><line x1="1022" y1="415" x2="1058" y2="415" stroke="#333333" stroke-width="3" marker-end="url(#a-333333)"/><line x1="1268" y1="415" x2="1304" y2="415" stroke="#333333" stroke-width="3" marker-end="url(#a-333333)"/><rect x="326" y="570" width="200" height="96" rx="14" fill="#F7F7F7" stroke="#CDCDCD" stroke-width="2"/><text x="348" y="613" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#1A1A1A" text-anchor="start">Local repo</text><text x="348" y="648" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="start">Your own .debs</text><path d="M526,618 H672 V538" fill="none" stroke="#333333" stroke-width="3" marker-end="url(#a-333333)"/><rect x="80" y="705" width="1440" height="100" rx="14" fill="#F7F7F7" stroke="none" stroke-width="2"/><text x="104" y="745" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="start">The supply-chain guarantee</text><text x="104" y="777" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">Machines verify every package against your public key. Anything you didn&#x27;t publish simply doesn&#x27;t exist for them.</text><line x1="80" y1="846" x2="1520" y2="846" st