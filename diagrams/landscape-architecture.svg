 (ESM)</text><circle cx="1250" cy="448" r="6" fill="#772953"/><text x="1268" y="455" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="20" font-weight="400" fill="#333333" text-anchor="start">Livepatch</text><line x1="380" y1="370" x2="552" y2="370" stroke="#333333" stroke-width="3" marker-end="url(#a-333333)"/><rect x="435.0" y="335.85" width="62" height="25.5" rx="6" fill="#fff" stroke="none" stroke-width="0"/><text x="466" y="353.7" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#6B6B6B" text-anchor="middle">HTTPS</text><line x1="1060" y1="370" x2="1212" y2="370" stroke="#772953" stroke-width="3" marker-end="url(#a-772953)"/><rect x="1081.5" y="335.85" width="109" height="25.5" rx="6" fill="#fff" stroke="none" stroke-width="0"/><text x="1136" y="353.7" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#772953" text-anchor="middle">pulls data</text><line x1="180" y1="650" x2="600" y2="532" stroke="#6B6B6B" stroke-width="2.5" marker-end="url(#a-6B6B6B)"/><line x1="425" y1="650" x2="680" y2="532" stroke="#6B6B6B" stroke-width="2.5" marker-end="url(#a-6B6B6B)"/><line x1="670" y1="650" x2="760" y2="532" stroke="#6B6B6B" stroke-width="2.5" marker-end="url(#a-6B6B6B)"/><line x1="915" y1="650" x2="860" y2="532" stroke="#6B6B6B" stroke-width="2.5" marker-end="url(#a-6B6B6B)"/><line x1="1160" y1="650" x2="940" y2="532" stroke="#6B6B6B" stroke-width="2.5" marker-end="url(#a-6B6B6B)"/><line x1="1405" y1="650" x2="1020" y2="532" stroke="#6B6B6B" stroke-width="2.5" marker-end="url(#a-6B6B6B)"/><rect x="500.0" y="570.0" width="620" height="36" rx="18.0" fill="#fff" stroke="#E95420" stroke-width="1.5"/><text x="810" y="594.84" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" 