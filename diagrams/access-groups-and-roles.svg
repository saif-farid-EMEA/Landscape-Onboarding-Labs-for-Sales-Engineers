<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Who can manage what"><title>Who can manage what</title><desc>Access groups decide WHICH machines; roles decide WHAT you can do to them</desc><defs><marker id="a-E95420" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E95420"/></marker><marker id="s-E95420" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E95420"/></marker><marker id="a-772953" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#772953"/></marker><marker id="s-772953" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#772953"/></marker><marker id="a-1A1A1A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="s-1A1A1A" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="a-333333" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="s-333333" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="a-6B6B6B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B6B"/></marker><marker id="s-6B6B6B" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B6B"/></marker><marker id="a-0E8420" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E8420"/></marker><marker id="s-0E8420" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E8420"/></marker><marker id="a-C7162B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7162B"/></marker><marker id="s-C7162B" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7162B"/></marker><marker id="a-C27A00" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A00"/></marker><marker id="s-C27A00" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A00"/></marker><marker id="a-9A9A9A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A9A9A"/></marker><marker id="s-9A9A9A" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A9A9A"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><rect x="80" y="44" width="64" height="8" rx="2" fill="#E95420"/><text x="80" y="104" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="46" font-weight="700" fill="#1A1A1A">Who can manage what</text><text x="80" y="146" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="25" fill="#6B6B6B">Access groups decide WHICH machines; roles decide WHAT you can do to them</text><rect x="100" y="200" width="920" height="580" rx="18" fill="#F5EAF0" stroke="#772953" stroke-width="2.5" stroke-dasharray="10 7"/><rect x="120" y="186" width="561" height="28" rx="6" fill="#fff" stroke="none" stroke-width="0"/><text x="132" y="206" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#772953" text-anchor="start">SECURITY-AUDITORS SEE ALL OF THIS (global + every child)</text><rect x="360" y="565" width="295" height="195" rx="18" fill="#FDEEE8" stroke="#E95420" stroke-width="2.5" stroke-dasharray="10 7"/><rect x="380" y="551" width="139" height="28" rx="6" fill="#fff" stroke="none" stroke-width="0"/><text x="392" y="571" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#E95420" text-anchor="start">DB-OPERATORS</text><path d="M600,308 V355.0 H380 V400" fill="none" stroke="#6B6B6B" stroke-width="2.5" marker-end="url(#a-6B6B6B)"/><path d="M600,308 V355.0 H850 V400" fill="none" stroke="#6B6B6B" stroke-width="2.5" marker-end="url(#a-6B6B6B)"/><path d="M380,478 V530.0 H230 V580" fill="none" stroke="#6B6B6B" stroke-width="2.5" marker-end="url(#a-6B6B6B)"/><path d="M380,478 V530.0 H530 V580" fill="none" stroke="#6B6B6B" stroke-width="2.5" marker-end="url(#a-6B6B6B)"/><rect x="490" y="232" width="220" height="76" rx="12" fill="#fff" stroke="#1A1A1A" stroke-width="2.5"/><text x="600" y="279" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="26" font-weight="700" fill="#1A1A1A" text-anchor="middle">global</text><rect x="270" y="402" width="220" height="76" rx="12" fill="#fff" stroke="#333333" stroke-width="2.5"/><text x="380" y="449" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="26" font-weight="700" fill="#1A1A1A" text-anchor="middle">servers</text><rect x="740" y="402" width="220" height="76" rx="12" fill="#fff" stroke="#333333" stroke-width="2.5"/><text x="850" y="449" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="26" font-weight="700" fill="#1A1A1A" text-anchor="middle">legacy</text><rect x="120" y="582" width="220" height="76" rx="12" fill="#fff" stroke="#333333" stroke-width="2.5"/><text x="230" y="629" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="26" font-weight="700" fill="#1A1A1A" text-anchor="middle">web</text><rect x="420" y="582" width="220" height="76" rx="12" fill="#fff" stroke="#333333" stroke-width="2.5"/><text x="530" y="629" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="26" font-weight="700" fill="#1A1A1A" text-anchor="middle">database</text><rect x="165.0" y="696.0" width="130" height="32" rx="16.0" fill="#F7F7F7" stroke="#CDCDCD" stroke-width="1.5"/><text x="230" y="718.12" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#333333" text-anchor="middle">web-01</text><rect x="465.0" y="696.0" width="130" height="32" rx="16.0" fill="#F7F7F7" stroke="#CDCDCD" stroke-width="1.5"/><text x="530" y="718.12" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#333333" text-anchor="middle">db-01</text><rect x="785.0" y="516.0" width="130" height="32" rx="16.0" fill="#F7F7F7" stroke="#CDCDCD" stroke-width="1.5"/><text x="850" y="538.12" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="600" fill="#333333" text-anchor="middle">legacy-01</text><rect x="1090" y="215" width="430" height="160" rx="14" fill="#F5EAF0" stroke="#772953" stroke-width="2"/><text x="1112" y="261" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">Security-Auditors</text><text x="1112" y="298" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">Permissions: view only</text><text x="1112" y="323" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">Access group: global</text><text x="1112" y="348" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">(rights include all children)</text><rect x="1090" y="560" width="430" height="160" rx="14" fill="#FDEEE8" stroke="#E95420" stroke-width="2"/><text x="1112" y="606" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">DB-Operators</text><text x="1112" y="643" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">Permissions: patch, run scripts</text><text x="1112" y="668" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">Access group: database</text><text x="1112" y="693" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#333333" text-anchor="start">(nothing else)</text><line x1="1090" y1="280" x2="718" y2="268" stroke="#772953" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#a-772953)"/><line x1="1090" y1="640" x2="648" y2="622" stroke="#E95420" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#a-E95420)"/><text x="1305" y="440" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="22" font-weight="700" fill="#1A1A1A" text-anchor="middle">Admins get roles.</text><text x="1305" y="470" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="20" font-weight="400" fill="#333333" text-anchor="middle">Roles point at access groups.</text><text x="1305" y="500" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="20" font-weight="400" fill="#333333" text-anchor="middle">Nobody needs SSH or root.</text><text x="80" y="822" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">Each machine is in exactly one access group  ·  rights on a parent include its children  ·  SSO via OIDC, AD or PAM</text><line x1="80" y1="846" x2="1520" y2="846" stroke="#E5E5E5" stroke-width="1.5"/><text x="80" y="874" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#8A8A8A">Landscape Onboarding Labs · Lab 10</text><text x="1520" y="874" font-family="Ubuntu, 'Ubuntu Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" fill="#8A8A8A" text-anchor="end">Source: Landscape documentation (Canonical)</text></svg>
